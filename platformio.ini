; PlatformIO project for the dew-point fan controller on the ESP32-2432S028R
; "Cheap Yellow Display" (CYD). Port of dew-point-fan-bt (Go/RPi) to Arduino/C++.
;
;   pio run                 build for the CYD
;   pio run -t upload       flash the firmware
;   pio run -t uploadfs     upload data/ (config.json) to LittleFS
;   pio device monitor      serial console @115200
;   pio test -e native      run the host unit tests (no board needed)

[platformio]
default_envs = cyd

; ---------- shared C++ settings ----------
[env]
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    ; TFT_eSPI's spi_bus_config_t initializer omits the data4..7 fields
    ; (guarded behind an ESP32-S2 macro), which trips -Wextra. Harmless, so
    ; silence just this one warning rather than dropping -Wextra everywhere.
    -Wno-missing-field-initializers
build_unflags = -std=gnu++11

; ---------- on-device: CYD (ESP32-2432S028R, WROOM-32, no PSRAM) ----------
[env:cyd]
; Pinned deliberately: this is the version the firmware was validated against
; (arduino-esp32 2.0.17). Later espressif32 releases move to arduino-esp32 3.x,
; which changes the HTTPClient/NimBLE APIs this code relies on.
platform = espressif32 @ 7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
upload_port = /dev/cu.usbserial-21420      ; <- CHANGE TO YOUR PORT
monitor_port = /dev/cu.usbserial-21420     ; <- SAME PORT
; upload_port = /dev/cu.usbserial-110      ; <- CHANGE TO YOUR PORT
; monitor_port = /dev/cu.usbserial-110     ; <- SAME PORT
board_build.filesystem = littlefs
; NimBLE + TFT_eSPI (+ optional WiFi) need code space; a small FS is plenty for
; one config.json.
board_build.partitions = min_spiffs.csv

lib_deps =
    h2zero/NimBLE-Arduino @ ^2.5.0
    bodmer/TFT_eSPI @ ^2.5.43
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4
    bblanchon/ArduinoJson @ ^7.1.0

build_flags =
    ${env.build_flags}
    ; ---- TFT_eSPI CYD configuration (replaces User_Setup.h) ----
    -DUSER_SETUP_LOADED=1
    -DILI9341_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DSPI_FREQUENCY=40000000
    -DTFT_SPI_MODE=SPI_MODE0
    ; NOTE: no TOUCH_CS - the XPT2046 touch is on a SEPARATE SPI bus (VSPI),
    ; driven by XPT2046_Touchscreen, not by TFT_eSPI. Because TOUCH_CS is
    ; intentionally undefined, TFT_eSPI prints a harmless #warning that its own
    ; touch functions are disabled (which is exactly what we want). The flag
    ; below silences that (and TFT_eSPI's other info #warnings).
    -DDISABLE_ALL_LIBRARY_WARNINGS=1
    -DCORE_DEBUG_LEVEL=2
    ; ---- NimBLE: observer (scan) only, no client/server/advertiser ----
    ; This firmware only ever scans (src/hardware/ble_scanner.cpp). Each role is
    ; #if-guarded inside the library, so switching the three unused ones off
    ; drops their code entirely (~7 kB client + ~16 kB server + ~5 kB
    ; advertising per NimBLE-Arduino's nimconfig.h) on this no-PSRAM board.
    ; CONFIG_BT_NIMBLE_ROLE_OBSERVER stays at its default 1 - that is the scanner.
    -DCONFIG_BT_NIMBLE_ROLE_CENTRAL=0
    -DCONFIG_BT_NIMBLE_ROLE_PERIPHERAL=0
    -DCONFIG_BT_NIMBLE_ROLE_BROADCASTER=0
    ; With central+peripheral off, NIMBLE_BLE_CONNECT is 0 and NimBLE's own
    ; ble_gap_rd_rem_ver_tx() loses both of its (properly #if-guarded) callers
    ; while the function itself stays unguarded - an upstream oversight in
    ; NimBLE-Arduino 2.5.0. Silence it for the libraries only; build_src_flags
    ; below switches the warning back on for our own code in src/.
    -Wno-unused-function

; -Wno-unused-function above applies to every compilation unit (there is no
; per-library flag in platformio.ini), so re-enable it for src/. lib/dewpoint
; keeps the warning via `pio test -e native`.
build_src_flags = -Wunused-function

; ---------- OTA upload over WiFi (espota) ----------
; Same firmware as [env:cyd], but uploaded over WiFi instead of USB. Flash the
; USB env once first (it carries the OTA responder), then:
;   pio run -e cyd_ota -t upload      OTA the firmware
;   pio run -e cyd_ota -t uploadfs    OTA the LittleFS data (config.json)
; If ota.password is set in config.json, append: --upload-flags --auth=<password>
[env:cyd_ota]
extends = env:cyd
upload_protocol = espota
upload_port = dpf-cyd.local      ; mDNS name (or the device IP)
upload_flags =
    --auth=dpf

; ---------- host unit tests (pure logic in lib/dewpoint) ----------
[env:native]
platform = native
test_framework = unity
build_flags =
    ${env.build_flags}
    -DUNIT_TEST
